<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Q5 - Supermarket Billing System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<header><h1>Supermarket Billing System</h1><p>Three-product customer bill</p></header>

<div class="products">
<section>
<h2>Product 1</h2>
<label>Quantity<input id="qty1" type="number" min="0" placeholder="Enter quantity"></label>
<label>Unit Price (₹)<input id="price1" type="number" min="0" step="0.01" placeholder="Enter price"></label>
</section>

<section>
<h2>Product 2</h2>
<label>Quantity<input id="qty2" type="number" min="0" placeholder="Enter quantity"></label>
<label>Unit Price (₹)<input id="price2" type="number" min="0" step="0.01" placeholder="Enter price"></label>
</section>

<section>
<h2>Product 3</h2>
<label>Quantity<input id="qty3" type="number" min="0" placeholder="Enter quantity"></label>
<label>Unit Price (₹)<input id="price3" type="number" min="0" step="0.01" placeholder="Enter price"></label>
</section>
</div>

<button onclick="calculateBill()">Generate Bill</button>
<div id="bill" class="bill">Enter product details and generate the bill.</div>
</div>
<script src="script.js"></script>
</body>
</html>
